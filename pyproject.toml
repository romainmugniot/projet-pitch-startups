[project]
name = "projet-pitch-startups"
version = "0.1.0"
description = "Peut-on prédire le succès d'une startup dès sa première phrase de pitch ?"
readme = "README.md"
requires-python = ">=3.10"
# Bornes hautes : la version majeure suivante, pas encore testée (testé avec pandas 3.0, plotly 7.2).
dependencies = [
    "pandas>=2.0,<4",
    "pyarrow>=14.0,<27",
    "requests>=2.31,<3",
    "s3fs>=2023.12,<2027",
    "numpy>=1.26,<3",
    "plotly>=5.20,<8",
    "nltk>=3.8,<4",
    "unidecode>=1.3,<2",
    "ipykernel>=6.29,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.4,<0.18",
    "nbstripout>=0.7,<1",
    "nbconvert>=7.0,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
