[project]
name = "projet-pitch-startups"
version = "0.1.0"
description = "Peut-on prédire le succès d'une startup dès sa première phrase de pitch ?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "s3fs>=2023.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "wordcloud>=1.9",
    "nltk>=3.8",
    "scikit-learn>=1.4",
    "unidecode>=1.3",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "nbstripout>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
